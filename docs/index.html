<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>linkbot demo</title>
<style>
:root {
  --bg: #eef1f5; --panel: #ffffff; --line: #d9dee5; --text: #1c2430; --muted: #6b7686;
  --accent: #2a7de1; --out: #d4e8ff; --out-text: #10253d; --in: #ffffff; --chat-bg: #dfe8f1;
  --mono-bg: #f3f5f8; --hl: #fff3b8; --new: #d3f4dd; --badge: #fff1d6; --badge-text: #7a4a00;
  --key: #8a4fd0; --str: #2c7a4b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161c; --panel: #1b212a; --line: #2c3541; --text: #e6ebf2; --muted: #8b97a8;
    --accent: #5aa2f5; --out: #2b5278; --out-text: #eef5ff; --in: #232b36; --chat-bg: #151b23;
    --mono-bg: #161c24; --hl: #4a4220; --new: #1f4a2e; --badge: #3d3016; --badge-text: #f1c778;
    --key: #c39bf0; --str: #7fd09a;
  }
}
:root[data-theme="dark"] {
  --bg: #12161c; --panel: #1b212a; --line: #2c3541; --text: #e6ebf2; --muted: #8b97a8;
  --accent: #5aa2f5; --out: #2b5278; --out-text: #eef5ff; --in: #232b36; --chat-bg: #151b23;
  --mono-bg: #161c24; --hl: #4a4220; --new: #1f4a2e; --badge: #3d3016; --badge-text: #f1c778;
  --key: #c39bf0; --str: #7fd09a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
header h1 { font-size: 16px; margin: 0; }
.badge { background: var(--badge); color: var(--badge-text); font-size: 12px; padding: 2px 8px; border-radius: 10px; }
.spacer { flex: 1; }
button {
  font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 12px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
.pane { min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.pane-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; }
.pane-head .name { font-weight: 600; line-height: 1.2; }
.pane-head .sub { color: var(--muted); font-size: 12px; }

#msgs { flex: 1; min-height: 0; overflow-y: auto; background: var(--chat-bg); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.msg { max-width: 82%; padding: 7px 11px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; animation: pop .15s ease-out; }
.msg.bot { align-self: flex-start; background: var(--in); border-bottom-left-radius: 4px; }
.msg.user { align-self: flex-end; background: var(--out); color: var(--out-text); border-bottom-right-radius: 4px; }
.msg.mono { font: 12.5px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.msg .card { border-left: 3px solid var(--accent); background: rgba(255,255,255,.35); padding: 4px 8px; margin-bottom: 4px; border-radius: 3px; white-space: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg .card { background: rgba(0,0,0,.2); } }
:root[data-theme="dark"] .msg .card { background: rgba(0,0,0,.2); }
.msg .card b { display: block; color: var(--accent); font-size: 12px; }
.msg a, .msg .url { color: var(--accent); }
.typing { align-self: flex-start; background: var(--in); border-radius: 14px; padding: 9px 12px; display: flex; gap: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

.inputbar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: var(--panel); }
#input { flex: 1; min-height: 34px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 17px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#input:empty::before { content: "Message"; color: var(--muted); }
.send { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; }

.vault { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(150px, 38%) 1fr; }
#tree { overflow-y: auto; border-right: 1px solid var(--line); padding: 8px; font-size: 13px; }
#tree .folder { color: var(--muted); margin: 8px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
#tree .file { padding: 2px 8px; border-radius: 4px; transition: background .3s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#tree .file.hl { background: var(--hl); }
#tree .file.open { outline: 1px solid var(--accent); }
#tree .file.fresh { background: var(--new); }
#note { overflow-y: auto; padding: 14px; font-size: 13px; }
#note .empty { color: var(--muted); }
#note h2 { margin: 0 0 8px; font-size: 16px; }
#note pre { background: var(--mono-bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; margin: 0 0 10px; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; }
#note .k { color: var(--key); } #note .v { color: var(--str); }

@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-auto-rows: minmax(420px, 70vh); overflow-y: auto; padding: 16px; }
  body { height: auto; min-height: 100%; }
  .vault { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  #tree { border-right: 0; border-bottom: 1px solid var(--line); max-height: 170px; }
}
@media (prefers-reduced-motion: reduce) { .msg, .typing i { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>linkbot</h1>
  <span class="badge">Scripted demo — not a live session</span>
  <span class="spacer"></span>
  <button id="pause" type="button">Pause</button>
  <button id="replay" type="button">Replay</button>
</header>
<main>
  <section class="pane" aria-label="Telegram chat">
    <div class="pane-head"><div class="avatar">L</div><div><div class="name">linkbot</div><div class="sub">bot</div></div></div>
    <div id="msgs" aria-live="polite"></div>
    <div class="inputbar"><div id="input"></div><div class="send">➤</div></div>
  </section>
  <section class="pane" aria-label="Obsidian vault">
    <div class="pane-head"><div class="avatar" style="background:#7c4dff">O</div><div><div class="name">Obsidian</div><div class="sub">demo-vault</div></div></div>
    <div class="vault"><div id="tree"></div><div id="note"><div class="empty">Select a note to preview it.</div></div></div>
  </section>
</main>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const speed = Math.max(0.25, parseFloat(params.get("speed")) || 1);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Event dates match demo/seed_vault.py: the coming Saturday and the Sunday after.
  const today = new Date();
  const iso = d => d.toISOString().slice(0, 10);
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const weekday = (today.getDay() + 6) % 7;
  const saturday = addDays(today, ((5 - weekday) % 7 + 7) % 7 || 7);
  const sunday = addDays(saturday, 1);
  const pretty = d => d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });

  const vault = [
    { name: "Sushi Kuuya", type: "restaurant", address: "12 Tras Street, Singapore", hours: "6pm-10:30pm, closed Sun", date: "", tags: ["japanese", "omakase", "date-spot", "tanjong pagar"], price_range: "$$$", source: "https://example.com/sushi-kuuya", description: "Intimate counter-only omakase with a seasonal menu." },
    { name: "Ramen Hako", type: "restaurant", address: "88 Orchard Road, Singapore", hours: "11am-10pm daily", date: "", tags: ["japanese", "ramen", "casual", "orchard"], price_range: "$", source: "https://example.com/ramen-hako", description: "Rich tonkotsu broth and a short, focused menu." },
    { name: "Birds of a Feather Cafe", type: "restaurant", address: "5 Jiak Chuan Road, Singapore", hours: "9am-5pm, closed Mon", date: "", tags: ["brunch", "cafe", "casual", "chinatown"], price_range: "$$", source: "https://example.com/birds-cafe", description: "Sunny brunch spot known for its eggs benedict and cold brew." },
    { name: "Hawker Supper Crawl", type: "event", address: "Maxwell Food Centre, Singapore", hours: "8pm-12am", date: iso(saturday), tags: ["supper", "hawker", "free", "cbd"], price_range: "$", source: "https://example.com/supper-crawl", description: "Guided late-night tasting walk across Maxwell and Chinatown Complex. Free to join." },
    { name: "Sunset Jazz at the Gardens", type: "event", address: "Singapore Botanic Gardens", hours: "5pm-9pm", date: iso(sunday), tags: ["music", "outdoor", "free", "date-spot"], price_range: "", source: "https://example.com/gardens-jazz", description: "Open-air jazz on the Symphony Lake stage. Bring a picnic mat." },
    { name: "Haw Par Villa", type: "place", address: "262 Pasir Panjang Road, Singapore", hours: "9am-7pm daily", date: "", tags: ["quirky", "sightseeing", "free", "west"], price_range: "", source: "https://example.com/haw-par-villa", description: "Surreal mythology theme park with dioramas of Chinese folklore." },
    { name: "Why Singapore's Hawker Culture Is Special", type: "article", address: "", hours: "", date: "", tags: ["food", "culture", "hawker"], price_range: "", source: "https://example.com/hawker-culture", description: "Long read on the history and future of Singapore's hawker centres." },
  ];

  const IG_URL = "https://www.instagram.com/reel/DJx4kQpRt2m/";
  const TT_URL = "https://www.tiktok.com/@sgfoodwander/video/7391204558816";
  const maru = { name: "Maru Donburi", type: "restaurant", address: "21 Bukit Pasoh Road, Singapore", hours: "5pm-10pm", date: "", tags: ["japanese", "donburi", "casual", "tanjong pagar"], price_range: "$$", source: IG_URL, description: "Tiny donburi counter serving thick-cut sashimi rice bowls and a daily special." };
  const souffle = { name: "Cloud Nine Souffle", type: "restaurant", address: "40 Tanjong Pagar Road, Singapore", hours: "12pm-9pm", date: "", tags: ["dessert", "cafe", "souffle", "tanjong pagar"], price_range: "$$", source: TT_URL, description: "Jiggly Japanese-style souffle pancakes, baked to order." };

  const $ = id => document.getElementById(id);
  const msgs = $("msgs"), input = $("input"), tree = $("tree"), note = $("note");

  // Same layout as bot.py _format_preview.
  function preview(e) {
    const dash = v => v || "—";
    return [
      `Name:        ${dash(e.name)}`, `Type:        ${dash(e.type)}`, `Address:     ${dash(e.address)}`,
      `Hours:       ${dash(e.hours)}`, `Date:        ${dash(e.date)}`, `Tags:        ${e.tags.join(", ") || "—"}`,
      `Price:       ${dash(e.price_range)}`, "", e.description, "", "Reply 'ok' to save, or type a correction.",
    ].join("\n");
  }

  // ---- playback control ----
  let run = 0, paused = false;
  const wait = async (ms, id) => {
    let left = reduced ? Math.min(ms, 120) : ms;
    left /= speed;
    while (left > 0) {
      if (id !== run) throw "cancelled";
      const slice = Math.min(left, 50);
      await new Promise(r => setTimeout(r, slice));
      if (!paused) left -= slice;
    }
    if (id !== run) throw "cancelled";
  };

  // ---- chat ----
  const scroll = () => { msgs.scrollTop = msgs.scrollHeight; };
  function bubble(who, text, { mono = false, card = null } = {}) {
    const el = document.createElement("div");
    el.className = `msg ${who}${mono ? " mono" : ""}`;
    if (card) {
      const c = document.createElement("div");
      c.className = "card";
      const b = document.createElement("b"); b.textContent = card.site;
      c.append(b, card.title);
      el.append(c);
    }
    el.append(text);
    msgs.append(el); scroll();
  }
  async function user(id, text, opts = {}) {
    if (!reduced) {
      for (let i = 1; i <= text.length; i++) { input.textContent = text.slice(0, i); await wait(Math.min(40, 1600 / text.length), id); }
    } else input.textContent = text;
    await wait(350, id);
    input.textContent = "";
    bubble("user", text, opts);
    await wait(500, id);
  }
  async function bot(id, text, { mono = false, think = 700 } = {}) {
    const t = document.createElement("div");
    t.className = "typing"; t.innerHTML = "<i></i><i></i><i></i>";
    msgs.append(t); scroll();
    try { await wait(think, id); } finally { t.remove(); }
    bubble("bot", text, { mono });
    await wait(450, id);
  }

  // ---- vault panel ----
  const TYPES = ["restaurant", "event", "place", "article"];
  let files = {};
  function renderTree() {
    tree.innerHTML = ""; files = {};
    const head = document.createElement("div"); head.className = "folder"; head.textContent = "Links"; tree.append(head);
    for (const type of TYPES) {
      const group = vault.filter(e => e.type === type);
      if (!group.length) continue;
      const f = document.createElement("div"); f.className = "folder"; f.textContent = `  ${type}`; tree.append(f);
      for (const e of group) {
        const el = document.createElement("div"); el.className = "file"; el.textContent = e.name; el.title = e.name;
        el.addEventListener("click", () => openNote(e.name));
        tree.append(el); files[e.name] = el;
      }
    }
  }
  function openNote(name) {
    const e = vault.find(x => x.name === name); if (!e) return;
    Object.values(files).forEach(f => f.classList.remove("open"));
    files[name].classList.add("open");
    files[name].scrollIntoView({ block: "nearest" });
    const fm = [["name", e.name], ["type", e.type], ["address", e.address], ["hours", e.hours], ["date", e.date], ["tags", e.tags], ["price_range", e.price_range], ["visited", false], ["source", e.source], ["saved", iso(today)]];
    note.innerHTML = "";
    const h = document.createElement("h2"); h.textContent = `${e.name}.md`;
    const pre = document.createElement("pre");
    pre.append("---\n");
    for (const [k, v] of fm) {
      const key = document.createElement("span"); key.className = "k"; key.textContent = k;
      const val = document.createElement("span"); val.className = "v";
      val.textContent = Array.isArray(v) ? `[${v.join(", ")}]` : (v === "" ? "''" : String(v));
      pre.append(key, ": ", val, "\n");
    }
    pre.append("---");
    const p = document.createElement("p"); p.textContent = e.description;
    note.append(h, pre, p);
  }
  function addEntry(e) {
    vault.push(e); renderTree();
    files[e.name].classList.add("fresh"); openNote(e.name);
  }
  function highlight(names) {
    Object.values(files).forEach(f => f.classList.remove("hl"));
    names.forEach(n => files[n] && files[n].classList.add("hl"));
  }

  // ---- the script ----
  async function script(id) {
    const instaCard = { site: "Instagram", title: "Reel · maru.donburi — thick-cut sashimi bowls at Bukit Pasoh" };
    const tiktokCard = { site: "TikTok", title: "@sgfoodwander — the souffle pancakes in Tanjong Pagar you need to try" };

    // 1. Instagram link, then a correction
    await user(id, IG_URL, { card: instaCard });
    await bot(id, "Fetching...", { think: 500 });
    await bot(id, preview(maru), { mono: true, think: 1800 });
    await wait(900, id);
    await user(id, "hours are 11am-9pm");
    maru.hours = "11am-9pm";
    await bot(id, "Applying correction...", { think: 400 });
    await bot(id, preview(maru), { mono: true, think: 1200 });
    await wait(700, id);
    await user(id, "ok");
    await bot(id, `Saved: ${maru.name}`, { think: 500 });
    addEntry({ ...maru, tags: [...maru.tags] });
    await wait(2200, id);

    // 2. TikTok link, saved straight away
    await user(id, TT_URL, { card: tiktokCard });
    await bot(id, "Fetching...", { think: 500 });
    await bot(id, preview(souffle), { mono: true, think: 1800 });
    await wait(700, id);
    await user(id, "ok");
    await bot(id, `Saved: ${souffle.name}`, { think: 500 });
    addEntry({ ...souffle, tags: [...souffle.tags] });
    await wait(2000, id);

    // 3. Queries
    await user(id, "japanese restaurants");
    highlight(["Sushi Kuuya", "Ramen Hako", "Maru Donburi"]);
    await bot(id, "Japanese restaurants you've saved:\n\n• Maru Donburi — sashimi rice bowls, $$, Bukit Pasoh Road (11am–9pm)\n• Ramen Hako — tonkotsu ramen, $, Orchard Road (11am–10pm daily)\n• Sushi Kuuya — counter omakase, $$$, Tras Street (6pm–10:30pm, closed Sun)", { think: 1500 });
    await wait(2200, id);

    await user(id, "free events this weekend");
    highlight(["Hawker Supper Crawl", "Sunset Jazz at the Gardens"]);
    await bot(id, `Two free events this weekend:\n\n• Hawker Supper Crawl — ${pretty(saturday)}, 8pm–12am, Maxwell Food Centre\n• Sunset Jazz at the Gardens — ${pretty(sunday)}, 5pm–9pm, Botanic Gardens (bring a picnic mat)`, { think: 1500 });
    await wait(2200, id);
    highlight([]);

    // 4. /plan
    await user(id, "/plan");
    await bot(id, "Lunch or dinner onwards? (default: dinner)", { think: 350 });
    await user(id, "dinner");
    await bot(id, "Which date? (e.g. today, tomorrow, or a date)", { think: 350 });
    await user(id, "saturday");
    await bot(id, "Any area preference? (e.g. orchard, cbd — or 'anywhere')", { think: 350 });
    await user(id, "anywhere");
    await bot(id, "Budget? (default: $ and $$)", { think: 350 });
    await user(id, "$$");
    await bot(id, "Any other preferences? (e.g. 'no seafood', 'celebrating anniversary' — or 'skip')", { think: 350 });
    await user(id, "skip");
    await bot(id, "Planning...", { think: 400 });
    highlight(["Maru Donburi", "Cloud Nine Souffle", "Hawker Supper Crawl"]);
    await bot(id, `Saturday evening plan (${pretty(saturday)})\n\n1. 6:00pm — Maru Donburi ($$)\nStill unvisited and open until 9pm; a relaxed donburi dinner on Bukit Pasoh Road.\n\n2. 7:30pm — Cloud Nine Souffle ($$)\nA short walk away, open until 9pm. Dessert before the night walk.\n\n3. 8:30pm — Hawker Supper Crawl (free)\nStarts at 8pm at Maxwell Food Centre, minutes from Tanjong Pagar.`, { think: 2200 });
  }

  async function start() {
    const id = ++run;
    paused = false; $("pause").textContent = "Pause";
    msgs.innerHTML = ""; input.textContent = "";
    vault.length = 7; renderTree();
    note.innerHTML = '<div class="empty">Select a note to preview it.</div>';
    try { await script(id); } catch (e) { if (e !== "cancelled") throw e; }
  }

  $("replay").addEventListener("click", start);
  $("pause").addEventListener("click", () => { paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; });
  renderTree();
  if (params.get("autoplay") !== "0") start();
})();
</script>
</body>
</html>
